basic:
  seed: 233
  GPU: 0
  debug: False
  id: 'unnamed'
  mode: train
  search: False
  amp: 'Native'

experiment:
  name: 'RandomKTrainTestSplit'
  random_state: 233
  run_fold: -1
  batch_sampler: False
  weight: False
  preprocess: JPEG_512_pan
  image_only: True
  skip_outlier: True
  outlier: train
  count: 16
  csv_file: 256_train+ext+rare.csv

data:
  dir_sv: '../tile_128'
  cell: 'input/train_cell_256'

model:
  name: 'se_resnext50_32x4d'
  from_checkpoint: 'none'
  out_feature: 19
  params:
    dropout: 0.5
    pretrained: True

train:
  dir: '../results'
  batch_size: 12
  num_epochs: 20
  cutmix: False
  beta: 1
  cutmix_prob: 1
  cutmix_prob_increase: 0
  validations_round: 1
  freeze_backbond: 1
  freeze_top_layer_groups: 0
  freeze_start_epoch: 0
  conf_aware: True
  conf_alpha: 0.5
  conf_gamma: 0.5
  conf_csv: 'predictions/pred-b3-f0.csv'

eval:
  batch_size: 1

loss:
  name: 'bce'
  cellweight: 0.1
  params:
    reduction: 'none'

optimizer:
  name: 'Adam'
  step: 1
  params:
    lr: 0.0002
    weight_decay: 0

scheduler:
  name: 'CosineAnnealingLR'
  warm_up: True
  params:
    factor: 0.1
    patience: 10

transform:
  name: 's_0220/sin_256_final'
  num_preprocessor: 10
  size: 256
